*/

const risk =
Math.abs(entry-sl)*lot*100;

const reward =
Math.abs(tp-entry)*lot*100;

trades[i-1].risk=risk;

document.getElementById("risk"+i)
.textContent="$"+risk.toFixed(2);

document.getElementById("rr"+i)
.textContent =
risk>0
? (reward/risk).toFixed(2)+" : 1"
: "—";

calculate();

}


function takeEntry(i){

calcEntry(i);

if(trades[i-1].risk<=0){

alert(
"Please enter Entry, Stop Loss and Position Size first."
);

return;

}

trades[i-1].status="taken";

document.getElementById("st"+i)
.textContent="✓ Entry taken";

calculate();

}


function setStatus(i,status){

if(trades[i-1].risk<=0){

alert("Set the trade details first.");

return;

}

trades[i-1].status=status;

if(status==="win"){

document.getElementById("st"+i)
.textContent="✓ Win";

}

else if(status==="loss"){

document.getElementById("st"+i)
.textContent="✕ Loss";

}

else{

document.getElementById("st"+i)
.textContent="= Breakeven";

}

calculate();

}


function resetEntry(i){

trades[i-1]={
risk:0,
status:""
};

document.getElementById("e"+i).value="";
document.getElementById("sl"+i).value="";
document.getElementById("tp"+i).value="";
document.getElementById("lot"+i).value="";

document.getElementById("risk"+i)
.textContent="$0.00";

document.getElementById("rr"+i)
.textContent="—";

document.getElementById("st"+i)
.textContent="Not taken";

calculate();

}


function calculate(){

const balance =
+document.getElementById("balance").value || 0;

const dailyRisk =
+document.getElementById("dailyRisk").value || 0;

const tradeRisk =
+document.getElementById("tradeRisk").value || 0;

const maxTrades =
+document.getElementById("maxTrades").value || 4;


const dailyLimit =
balance*dailyRisk/100;

const riskPerTrade =
balance*tradeRisk/100;


const usedRisk =
trades.reduce(
(sum,trade)=>
sum+(trade.status ? trade.risk : 0),
0
);


const remaining =
Math.max(0,dailyLimit-usedRisk);


const taken =
trades.filter(
trade=>trade.status
).length;


document.getElementById("dailyLimit")
.textContent="$"+dailyLimit.toFixed(2);

document.getElementById("usedRisk")
.textContent="$"+usedRisk.toFixed(2);

document.getElementById("remainingRisk")
.textContent="$"+remaining.toFixed(2);

document.getElementById("riskPerTrade")
.textContent="$"+riskPerTrade.toFixed(2);

document.getElementById("tradesTaken")
.textContent=taken+" / "+maxTrades;


const message =
document.getElementById("message");


if(remaining<=0 && dailyLimit>0){

message.textContent=
"⚠ Daily risk limit reached. No more risk is available today.";

}

else if(taken>=maxTrades){

message.textContent=
"✓ Maximum planned trades reached for today.";

}

else{

message.textContent=
`You can take ${maxTrades-taken} more planned entry/entries today.`;

}

}


calculate();

</script>
