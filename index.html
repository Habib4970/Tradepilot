<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trading Risk Calculator</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#080b18;
    color:#ffffff;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#7c8cff;
}

.subtitle{
    text-align:center;
    color:#8f96ad;
    margin-bottom:25px;
}

.card{
    background:#101528;
    border:1px solid #202844;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:18px;
    color:#64e6ff;
    font-size:20px;
}

/* SETTINGS */

.settings-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

label{
    display:block;
    color:#9da5bd;
    font-size:13px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #2b3557;
    background:#080c1b;
    color:white;
    outline:none;
}

input:focus,
select:focus{
    border-color:#6677ff;
}

/* SAVE BUTTON */

.save-btn{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:linear-gradient(90deg,#6677ff,#35d8f4);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:hover{
    opacity:.9;
}

.save-message{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:8px;
    background:#10271f;
    color:#43e6a1;
    text-align:center;
    font-size:14px;
}

/* GENERAL BUTTON */

.btn{
    padding:11px 18px;
    border:none;
    border-radius:8px;
    background:linear-gradient(90deg,#6677ff,#35d8f4);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

/* ENTRY TABS */

.entry-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.entry-tab{
    padding:12px;
    background:#080c1b;
    border:1px solid #2b3557;
    border-radius:8px;
    color:#aaa;
    cursor:pointer;
    text-align:center;
}

.entry-tab.active{
    background:#6677ff;
    color:white;
    border-color:#6677ff;
}

/* ENTRY */

.entry{
    display:none;
}

.entry.active{
    display:block;
}

.entry-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.entry-buttons{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* STATUS */

.status-buttons{
    display:flex;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}

.status-btn{
    padding:8px 15px;
    border-radius:7px;
    border:1px solid #303956;
    background:#080c1b;
    color:#aaa;
    cursor:pointer;
}

.status-btn:hover{
    border-color:#6677ff;
}

.status-btn.active{
    background:#6677ff;
    color:white;
}

/* RESULTS */

.result-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.result{
    background:#080c1b;
    border:1px solid #252e4b;
    padding:15px;
    border-radius:10px;
}

.result span{
    display:block;
    color:#8991aa;
    font-size:12px;
    margin-bottom:5px;
}

.result strong{
    font-size:18px;
}

/* WARNING */

.warning{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#251a10;
    color:#ffb45c;
    display:none;
}

/* MOBILE */

@media(max-width:800px){

    .settings-grid,
    .entry-grid,
    .result-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:500px){

    body{
        padding:12px;
    }

    .settings-grid,
    .entry-grid,
    .result-grid{
        grid-template-columns:1fr;
    }

    .entry-tabs{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>
